<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <!-- Left section: Expense form -->
      <section class="expense-tracker">
        <h1>Expense Tracker</h1>
        <p>Manage and track your expenses in one place.</p>

        <h2>Add Expense</h2>

        <div class="expense-form">
          <div class="form-field">
            <label for="description">Description</label>
            <input
              type="text"
              id="description"
              name="description"
              placeholder="e.g. Grocery shopping"
              required
            />
          </div>

          <div class="form-field">
            <label for="amount">Amount</label>
            <input
              type="number"
              id="amount"
              name="amount"
              placeholder="Enter amount"
              min="0.01"
              step="0.01"
              required
            />
          </div>

          <div class="form-field">
            <label for="category">Category</label>
            <input
              type="text"
              id="category"
              name="category"
              placeholder="e.g. Food"
              required
            />
          </div>

          <div class="form-actions">
            <button
              type="button"
              class="cancel-update"
              id="cancelUpdate"
            >
              Cancel
            </button>

            <button
              type="button"
              class="add-expense"
              id="addExpense"
            >
              Add Expense
            </button>
          </div>
        </div>
      </section>

      <section class="expense-list-section">
        <div class="expense-list">
          <h2>Expenses</h2>
          <ul id="expenses">
            <li>No expenses recorded.</li>
          </ul>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
